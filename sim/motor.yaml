# AM2634 R5F core 0 running fw/foc.release.out against a simulated PMSM and encoder.
machines:
  dut:
    mcu: AM2634-R5F0_0
    elf: ../fw/foc.release.out
    parts:
      - { name: plant,   type: peripheral,  address: 0xA0000400, size: 0x4, script: plant.py }
      - { name: encoder, type: gpio-device, outputs: [iomux.37, iomux.38], script: encoder.py }
quantum: 0.00001
